services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haroid
      POSTGRES_USER: haroid
      POSTGRES_PASSWORD: haroid-local
    volumes:
      - haroid_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haroid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - haroid_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      HAROID_ENV: development
      DATABASE_URL: postgresql://haroid:haroid-local@postgres:5432/haroid
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-compose-jwt-secret-change-before-deploy
      HAROID_ENCRYPTION_KEY: local-compose-encryption-secret-change-before-deploy
      CORS_ORIGINS: http://localhost:3000
      AUTO_CREATE_TABLES: "0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./web:/app
      - haroid_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  haroid_postgres:
  haroid_redis:
  haroid_node_modules:
